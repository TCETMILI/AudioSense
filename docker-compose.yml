# docker-compose.yml
version: "3.8"
services:
  backend:
    build: .
    command: uvicorn backend:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  frontend:
    build: .
    command: python frontend.py --server.host 0.0.0.0 --server.port 7860
    ports:
      - "7860:7860"
    depends_on:
      - backend

